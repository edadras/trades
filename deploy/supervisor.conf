; Long-running processes for production (Ubuntu: /etc/supervisor/conf.d/hamyar.conf)
[program:hamyar-horizon]
command=php /var/www/hamyar/artisan horizon
user=www-data
autostart=true
autorestart=true
stopwaitsecs=3600
stdout_logfile=/var/www/hamyar/storage/logs/horizon.log

[program:hamyar-reverb]
command=php /var/www/hamyar/artisan reverb:start --host=127.0.0.1 --port=8080
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/www/hamyar/storage/logs/reverb.log

[program:hamyar-ssr]
command=php /var/www/hamyar/artisan inertia:start-ssr
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/www/hamyar/storage/logs/ssr.log
